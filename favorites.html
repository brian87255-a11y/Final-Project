<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>2000s Music — Favorites</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" />
  <link rel="stylesheet" href="css/style.css" />
  <style>
    .fav-row {
      display: grid;
      grid-template-columns: 28px 44px 1fr auto auto 32px;
      align-items: center;
      gap: 14px;
      padding: 7px 12px;
      border-radius: var(--r-md);
      transition: background 0.15s;
      cursor: pointer;
    }

    .fav-row:hover { background: rgba(255,255,255,0.05); }

    .fav-rank { font-size: 0.8rem; color: var(--text-tertiary); text-align:right; font-variant-numeric:tabular-nums; }

    .fav-art {
      width: 44px; height: 44px;
      border-radius: 7px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.4rem;
      flex-shrink: 0;
    }

    .fav-info { min-width: 0; }
    .fav-name { font-size: 0.9rem; font-weight: 500; color: var(--text-primary); letter-spacing:-0.01em; white-space:nowrap;overflow:hidden;text-overflow:ellipsis; }
    .fav-artist { font-size: 0.78rem; color: var(--text-secondary); }

    .fav-year { font-size: 0.8rem; color: var(--text-tertiary); white-space:nowrap; display:none; }
    @media (min-width:576px) { .fav-year { display:block; } }

    .fav-dur { font-size: 0.8rem; color: var(--text-tertiary); font-variant-numeric:tabular-nums; white-space:nowrap; }

    .heart-btn {
      background: none;
      border: none;
      cursor: pointer;
      font-size: 1rem;
      color: var(--red);
      transition: transform 0.2s;
      padding: 4px;
      line-height: 1;
    }
    .heart-btn:hover { transform: scale(1.25); }

    /* Toast */
    .toast-pill {
      position: fixed;
      bottom: 2rem;
      left: 50%;
      transform: translateX(-50%) translateY(20px);
      background: var(--surface-2);
      border: 1px solid var(--border);
      border-radius: var(--r-full);
      padding: 0.6rem 1.4rem;
      font-size: 0.85rem;
      font-weight: 600;
      color: var(--text-primary);
      box-shadow: 0 8px 32px rgba(0,0,0,0.4);
      opacity: 0;
      transition: all 0.3s cubic-bezier(0.34,1.56,0.64,1);
      white-space: nowrap;
      z-index: 9999;
    }

    .toast-pill.show {
      opacity: 1;
      transform: translateX(-50%) translateY(0);
    }

    .stats-strip {
      display: flex;
      gap: 1px;
      background: var(--border);
      border-radius: var(--r-xl);
      overflow: hidden;
      margin-bottom: 2rem;
    }

    .stat-cell {
      flex: 1;
      background: var(--surface);
      padding: 1.2rem 1.5rem;
      text-align: center;
    }

    .stat-cell-num {
      font-size: 1.6rem;
      font-weight: 900;
      letter-spacing: -0.04em;
      color: var(--text-primary);
    }

    .stat-cell-label {
      font-size: 0.7rem;
      font-weight: 600;
      letter-spacing: 0.06em;
      text-transform: uppercase;
      color: var(--text-tertiary);
      margin-top: 3px;
    }
  </style>
</head>
<body class="d-flex flex-column min-vh-100">
<div id="navbar-placeholder"></div>

<div class="page-wrapper flex-grow-1">
  <div class="container">

    <div class="page-hero anim-fade-up">
      <span class="eyebrow mb-2 d-block">Your Collection</span>
      <h1 style="font-size:clamp(2rem,5vw,3rem);font-weight:900;letter-spacing:-0.04em;">Favorites</h1>
    </div>

    <!-- STATS -->
    <div class="stats-strip anim-fade-up delay-1" id="statsStrip">
      <div class="stat-cell">
        <div class="stat-cell-num" id="statCount">0</div>
        <div class="stat-cell-label">Saved</div>
      </div>
      <div class="stat-cell">
        <div class="stat-cell-num" id="statTime">0</div>
        <div class="stat-cell-label">Minutes</div>
      </div>
      <div class="stat-cell">
        <div class="stat-cell-num" id="statGenres">0</div>
        <div class="stat-cell-label">Genres</div>
      </div>
    </div>

    <!-- CONTROLS -->
    <div class="d-flex align-items-center justify-content-between flex-wrap gap-3 mb-3 anim-fade-up delay-1">
      <div class="d-flex gap-2">
        <a href="player.html" class="btn-primary-music" style="font-size:0.82rem;padding:0.5rem 1.1rem;">
          <svg width="11" height="11" viewBox="0 0 16 16" fill="currentColor"><path d="M3 2l10 6-10 6V2z"/></svg>
          Play All
        </a>
        <button class="btn-ghost" onclick="addRandom()" style="font-size:0.82rem;padding:0.5rem 1.1rem;">+ Add Random</button>
      </div>
      <button onclick="clearAll()" style="background:none;border:none;font-size:0.8rem;font-weight:600;color:var(--text-tertiary);cursor:pointer;transition:color 0.2s;font-family:var(--font-sans);" onmouseover="this.style.color='var(--red)'" onmouseout="this.style.color='var(--text-tertiary)'">Clear all</button>
    </div>

    <!-- LIST -->
    <div class="anim-fade-up delay-2" id="favList"></div>

    <div id="emptyState" style="display:none;text-align:center;padding:5rem 1rem;">
      <div style="font-size:3.5rem;margin-bottom:1rem;">💔</div>
      <h3 style="font-size:1.2rem;font-weight:700;letter-spacing:-0.03em;margin-bottom:0.5rem;">No favorites yet</h3>
      <p style="color:var(--text-secondary);font-size:0.9rem;margin-bottom:2rem;">Head to the library and save some tracks to see them here.</p>
      <a href="library.html" class="btn-ghost">Browse Library →</a>
    </div>

    <!-- SUGGESTED -->
    <div class="mt-5 anim-fade-up delay-3" id="suggestedSection">
      <div class="section-head mb-3">
        <h2 class="section-title" style="font-size:1.2rem;">You Might Also Like</h2>
      </div>
      <div class="row g-3" id="suggested"></div>
    </div>

    <div style="height:3rem;"></div>
  </div>
</div>

<div class="toast-pill" id="toast"></div>
<div id="footer-placeholder"></div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="js/components.js"></script>
<script>
  document.getElementById('navbar-placeholder').innerHTML = getNavHTML('favorites');
  document.getElementById('footer-placeholder').innerHTML = getFooterHTML();

  const allSongs = [
    { emoji:'🎤', title:'Lose Yourself',       artist:'Eminem',          genre:'Hip-Hop',  year:'2002', sec:326, bg:'linear-gradient(135deg,#1a1a2e,#2d2d5e)' },
    { emoji:'💃', title:'Crazy In Love',       artist:'Beyoncé',          genre:'R&B',      year:'2003', sec:236, bg:'linear-gradient(135deg,#1e0a2e,#3d1060)' },
    { emoji:'🎸', title:'In The End',          artist:'Linkin Park',      genre:'Rock',     year:'2001', sec:216, bg:'linear-gradient(135deg,#0a1a0a,#1a3a1a)' },
    { emoji:'⚡', title:'Yeah!',               artist:'Usher',            genre:'R&B',      year:'2004', sec:252, bg:'linear-gradient(135deg,#1a0a00,#3d1f00)' },
    { emoji:'☂️', title:'Umbrella',            artist:'Rihanna',          genre:'Pop',      year:'2007', sec:276, bg:'linear-gradient(135deg,#00101a,#003d5c)' },
    { emoji:'💥', title:'Mr. Brightside',     artist:'The Killers',      genre:'Rock',     year:'2003', sec:222, bg:'linear-gradient(135deg,#1a000a,#3d0018)' },
    { emoji:'💰', title:'Gold Digger',        artist:'Kanye West',       genre:'Hip-Hop',  year:'2005', sec:208, bg:'linear-gradient(135deg,#0a0a1a,#1a1a4a)' },
    { emoji:'⚡', title:'Since U Been Gone',  artist:'Kelly Clarkson',   genre:'Pop Rock', year:'2004', sec:188, bg:'linear-gradient(135deg,#1a001a,#3d0040)' },
    { emoji:'🎉', title:'Hey Ya!',            artist:'OutKast',          genre:'Pop',      year:'2003', sec:235, bg:'linear-gradient(135deg,#1a1000,#4a2800)' },
    { emoji:'💋', title:'Toxic',              artist:'Britney Spears',   genre:'Pop',      year:'2003', sec:212, bg:'linear-gradient(135deg,#1a0010,#3d0028)' },
  ];

  let favorites = [0, 2, 4, 6];

  function fmt(sec) {
    return Math.floor(sec/60) + ':' + (sec%60).toString().padStart(2,'0');
  }

  function toast(msg) {
    const el = document.getElementById('toast');
    el.textContent = msg;
    el.classList.add('show');
    setTimeout(() => el.classList.remove('show'), 2200);
  }

  function updateStats() {
    document.getElementById('statCount').textContent = favorites.length;
    const totalSec = favorites.reduce((a, i) => a + allSongs[i].sec, 0);
    document.getElementById('statTime').textContent = Math.round(totalSec / 60);
    document.getElementById('statGenres').textContent = new Set(favorites.map(i => allSongs[i].genre)).size;
  }

  function toggleFav(idx) {
    const pos = favorites.indexOf(idx);
    if (pos === -1) { favorites.push(idx); toast('Added to favorites'); }
    else { favorites.splice(pos, 1); toast('Removed from favorites'); }
    render();
  }

  function addRandom() {
    const available = allSongs.map((_,i) => i).filter(i => !favorites.includes(i));
    if (!available.length) { toast('All songs already saved'); return; }
    const pick = available[Math.floor(Math.random() * available.length)];
    favorites.push(pick);
    toast('Added: ' + allSongs[pick].title);
    render();
  }

  function clearAll() { favorites = []; render(); }

  function render() {
    updateStats();

    const list = document.getElementById('favList');
    const empty = document.getElementById('emptyState');
    const suggested = document.getElementById('suggestedSection');

    if (!favorites.length) {
      list.innerHTML = '';
      empty.style.display = 'block';
      suggested.style.display = 'none';
      return;
    }

    empty.style.display = 'none';
    suggested.style.display = 'block';

    list.innerHTML = favorites.map((si, rank) => {
      const s = allSongs[si];
      return `
        <div class="fav-row">
          <span class="fav-rank">${rank + 1}</span>
          <div class="fav-art" style="background:${s.bg};">${s.emoji}</div>
          <div class="fav-info">
            <div class="fav-name">${s.title}</div>
            <div class="fav-artist">${s.artist}</div>
          </div>
          <span class="fav-year">${s.year}</span>
          <span class="fav-dur">${fmt(s.sec)}</span>
          <button class="heart-btn" onclick="toggleFav(${si})" title="Remove">♥</button>
        </div>
      `;
    }).join('');

    // Suggested
    const notFaved = allSongs.map((_,i) => i).filter(i => !favorites.includes(i)).slice(0, 4);
    document.getElementById('suggested').innerHTML = notFaved.map(si => {
      const s = allSongs[si];
      return `
        <div class="col-6 col-md-3">
          <div class="music-card">
            <div class="card-art" style="background:${s.bg};">
              <span style="font-size:2.5rem;">${s.emoji}</span>
              <div class="play-overlay"><div class="play-btn-circle">▶</div></div>
            </div>
            <div class="card-body" style="display:flex;align-items:center;justify-content:space-between;gap:8px;">
              <div style="min-width:0;">
                <div class="card-title">${s.title}</div>
                <div class="card-sub">${s.artist}</div>
              </div>
              <button onclick="toggleFav(${si})" style="background:none;border:none;cursor:pointer;font-size:1.1rem;color:var(--text-tertiary);flex-shrink:0;transition:color 0.2s,transform 0.2s;" onmouseover="this.style.color='var(--red)';this.style.transform='scale(1.2)'" onmouseout="this.style.color='var(--text-tertiary)';this.style.transform='scale(1)'">♡</button>
            </div>
          </div>
        </div>
      `;
    }).join('');
  }

  render();
</script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>2000s Music — Song Library</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" />
  <link rel="stylesheet" href="css/style.css" />
  <style>
    .search-bar {
      position: relative;
      max-width: 420px;
    }
    .search-bar input {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--r-full);
      color: var(--text-primary);
      font-family: var(--font-sans);
      font-size: 0.875rem;
      padding: 0.6rem 1rem 0.6rem 2.6rem;
      width: 100%;
      transition: border-color 0.2s, box-shadow 0.2s;
      outline: none;
    }
    .search-bar input:focus {
      border-color: rgba(255,255,255,0.25);
      box-shadow: 0 0 0 3px rgba(255,255,255,0.05);
    }
    .search-bar input::placeholder { color: var(--text-tertiary); }
    .search-bar .search-icon {
      position: absolute;
      left: 0.9rem;
      top: 50%;
      transform: translateY(-50%);
      color: var(--text-tertiary);
      font-size: 0.85rem;
      pointer-events: none;
    }

    .filter-btn {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--r-full);
      color: var(--text-secondary);
      font-family: var(--font-sans);
      font-size: 0.8rem;
      font-weight: 500;
      padding: 0.5rem 1rem;
      cursor: pointer;
      transition: all 0.2s;
      white-space: nowrap;
    }
    .filter-btn:hover, .filter-btn.active {
      background: rgba(255,255,255,0.1);
      border-color: var(--border-hover);
      color: var(--text-primary);
    }
    .filter-btn.active {
      background: var(--text-primary);
      color: var(--bg);
      border-color: var(--text-primary);
    }

    .table-header {
      display: grid;
      grid-template-columns: 40px 44px 1fr 100px 60px 50px;
      gap: 12px;
      align-items: center;
      padding: 0 12px 10px;
      border-bottom: 1px solid var(--border);
      margin-bottom: 4px;
    }

    .table-header span {
      font-size: 0.7rem;
      font-weight: 600;
      color: var(--text-tertiary);
      letter-spacing: 0.06em;
      text-transform: uppercase;
    }

    @media (max-width: 768px) {
      .table-header { grid-template-columns: 28px 40px 1fr 50px; }
      .col-genre-h, .col-year-h { display: none; }
    }
  </style>
</head>
<body class="d-flex flex-column min-vh-100">
<div id="navbar-placeholder"></div>

<div class="page-wrapper flex-grow-1">
  <div class="container">

    <!-- PAGE HERO -->
    <div class="page-hero anim-fade-up">
      <span class="eyebrow mb-2 d-block">Music Archive</span>
      <h1 style="font-size:clamp(2rem,5vw,3rem);font-weight:900;letter-spacing:-0.04em;">Song Library</h1>
      <p style="color:var(--text-secondary);margin-top:0.5rem;font-size:0.95rem;">500+ tracks from the greatest decade in music.</p>
    </div>

    <!-- SEARCH + FILTERS -->
    <div class="d-flex flex-wrap align-items-center gap-3 mb-4 anim-fade-up delay-1">
      <div class="search-bar flex-grow-1" style="max-width:360px;">
        <span class="search-icon">⌕</span>
        <input type="text" id="searchInput" placeholder="Search songs, artists…" oninput="filterSongs()" />
      </div>
      <div class="d-flex gap-2 flex-wrap">
        <button class="filter-btn active" data-genre="" onclick="setGenre(this,'')">All</button>
        <button class="filter-btn" data-genre="Hip-Hop" onclick="setGenre(this,'Hip-Hop')">Hip-Hop</button>
        <button class="filter-btn" data-genre="R&B" onclick="setGenre(this,'R&B')">R&amp;B</button>
        <button class="filter-btn" data-genre="Rock" onclick="setGenre(this,'Rock')">Rock</button>
        <button class="filter-btn" data-genre="Pop" onclick="setGenre(this,'Pop')">Pop</button>
        <button class="filter-btn" data-genre="Pop Rock" onclick="setGenre(this,'Pop Rock')">Pop Rock</button>
      </div>
    </div>

    <!-- TRACK TABLE -->
    <div class="anim-fade-up delay-2">
      <div class="table-header">
        <span>#</span>
        <span></span>
        <span>Title</span>
        <span class="col-genre-h">Genre</span>
        <span class="col-year-h">Year</span>
        <span style="text-align:right;">⏱</span>
      </div>
      <div id="songList"></div>
    </div>

    <div id="noResults" style="display:none;text-align:center;padding:4rem 0;">
      <p style="color:var(--text-tertiary);font-size:0.95rem;">No tracks found. Try a different search.</p>
    </div>

    <div style="height:3rem;"></div>
  </div>
</div>

<div id="footer-placeholder"></div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="js/components.js"></script>
<script>
  document.getElementById('navbar-placeholder').innerHTML = getNavHTML('library');
  document.getElementById('footer-placeholder').innerHTML = getFooterHTML();

  const songs = [
    { num:1,  emoji:'🎤', title:'Lose Yourself',           artist:'Eminem',                   genre:'Hip-Hop',  year:'2002', dur:'5:26', slug:'lose-yourself',    bg:'linear-gradient(135deg,#1a1a2e,#2d2d5e)' },
    { num:2,  emoji:'🎸', title:'In The End',              artist:'Linkin Park',               genre:'Rock',     year:'2001', dur:'3:36', slug:'in-the-end',        bg:'linear-gradient(135deg,#0a1a0a,#1a3a1a)' },
    { num:3,  emoji:'💃', title:'Crazy In Love',           artist:'Beyoncé ft. Jay-Z',         genre:'R&B',      year:'2003', dur:'3:56', slug:'crazy-in-love',     bg:'linear-gradient(135deg,#1e0a2e,#3d1060)' },
    { num:4,  emoji:'⚡', title:'Yeah!',                   artist:'Usher ft. Lil Jon',         genre:'R&B',      year:'2004', dur:'4:12', slug:'yeah',              bg:'linear-gradient(135deg,#1a0a00,#3d1f00)' },
    { num:5,  emoji:'🌍', title:'Beautiful Day',           artist:'U2',                        genre:'Rock',     year:'2000', dur:'4:06', slug:'beautiful-day',     bg:'linear-gradient(135deg,#001020,#002040)' },
    { num:6,  emoji:'🛹', title:'Sk8er Boi',               artist:'Avril Lavigne',             genre:'Pop Rock', year:'2002', dur:'3:24', slug:'sk8er-boi',         bg:'linear-gradient(135deg,#1a001a,#3d003d)' },
    { num:7,  emoji:'🌟', title:'Irreplaceable',           artist:'Beyoncé',                   genre:'Pop',      year:'2006', dur:'3:48', slug:'irreplaceable',     bg:'linear-gradient(135deg,#1a1000,#3d2800)' },
    { num:8,  emoji:'☂️', title:'Umbrella',                artist:'Rihanna',                   genre:'Pop',      year:'2007', dur:'4:36', slug:'umbrella',          bg:'linear-gradient(135deg,#00101a,#003d5c)' },
    { num:9,  emoji:'⚡', title:'Since U Been Gone',       artist:'Kelly Clarkson',            genre:'Pop Rock', year:'2004', dur:'3:08', slug:'since-u-been-gone', bg:'linear-gradient(135deg,#1a001a,#3d0040)' },
    { num:10, emoji:'💰', title:'Gold Digger',             artist:'Kanye West ft. Jamie Foxx', genre:'Hip-Hop',  year:'2005', dur:'3:28', slug:'gold-digger',       bg:'linear-gradient(135deg,#0a0a1a,#1a1a4a)' },
    { num:11, emoji:'😶', title:'Numb',                    artist:'Linkin Park',               genre:'Rock',     year:'2003', dur:'3:07', slug:'numb',              bg:'linear-gradient(135deg,#0a0a0a,#2a2a2a)' },
    { num:12, emoji:'💃', title:"Hips Don't Lie",          artist:'Shakira ft. Wyclef Jean',   genre:'Pop',      year:'2006', dur:'3:38', slug:'hips-dont-lie',     bg:'linear-gradient(135deg,#1a0500,#3d1200)' },
    { num:13, emoji:'❄️', title:"Drop It Like It's Hot",  artist:'Snoop Dogg ft. Pharrell',   genre:'Hip-Hop',  year:'2004', dur:'4:28', slug:'drop-it',           bg:'linear-gradient(135deg,#001a10,#003d20)' },
    { num:14, emoji:'🎉', title:'Hey Ya!',                 artist:'OutKast',                   genre:'Pop',      year:'2003', dur:'3:55', slug:'hey-ya',            bg:'linear-gradient(135deg,#1a1000,#4a2800)' },
    { num:15, emoji:'💋', title:'Toxic',                   artist:'Britney Spears',            genre:'Pop',      year:'2003', dur:'3:32', slug:'toxic',             bg:'linear-gradient(135deg,#1a0010,#3d0028)' },
    { num:16, emoji:'🎵', title:'1, 2 Step',               artist:'Ciara ft. Missy Elliott',   genre:'R&B',      year:'2004', dur:'3:57', slug:'1-2-step',          bg:'linear-gradient(135deg,#001a1a,#003d3d)' },
    { num:17, emoji:'🖤', title:'Welcome To The Black Parade', artist:'My Chemical Romance',  genre:'Rock',     year:'2006', dur:'5:11', slug:'black-parade',      bg:'linear-gradient(135deg,#0a0a0a,#1a0000)' },
    { num:18, emoji:'💥', title:'Mr. Brightside',          artist:'The Killers',               genre:'Rock',     year:'2003', dur:'3:42', slug:'mr-brightside',     bg:'linear-gradient(135deg,#1a000a,#3d0018)' },
    { num:19, emoji:'🎤', title:'The Real Slim Shady',     artist:'Eminem',                    genre:'Hip-Hop',  year:'2000', dur:'4:44', slug:'real-slim-shady',   bg:'linear-gradient(135deg,#1a1a1a,#3a3a3a)' },
    { num:20, emoji:'🌙', title:'Crazy',                   artist:'Gnarls Barkley',            genre:'Pop',      year:'2006', dur:'2:59', slug:'crazy',             bg:'linear-gradient(135deg,#0a001a,#200040)' },
  ];

  let activeGenre = '';

  function setGenre(btn, genre) {
    activeGenre = genre;
    document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    filterSongs();
  }

  function filterSongs() {
    const q = document.getElementById('searchInput').value.toLowerCase().trim();
    const filtered = songs.filter(s =>
      (!q || s.title.toLowerCase().includes(q) || s.artist.toLowerCase().includes(q)) &&
      (!activeGenre || s.genre === activeGenre)
    );
    render(filtered);
  }

  function render(list) {
    const container = document.getElementById('songList');
    const noResults = document.getElementById('noResults');
    if (!list.length) {
      container.innerHTML = '';
      noResults.style.display = 'block';
      return;
    }
    noResults.style.display = 'none';
    container.innerHTML = list.map((s,i) => `
      <a href="player.html?song=${s.slug}" class="text-decoration-none d-block">
        <div class="track-row" style="position:relative;">
          <div style="position:relative;display:flex;align-items:center;justify-content:flex-end;">
            <span class="track-num">${s.num}</span>
            <span class="track-play-icon" style="position:absolute;right:0;">▶</span>
          </div>
          <div class="track-art-sm" style="background:${s.bg};">${s.emoji}</div>
          <div style="min-width:0;">
            <div class="track-name">${s.title}</div>
            <div class="track-artist">${s.artist}</div>
          </div>
          <span class="track-genre-tag">${s.genre}</span>
          <span style="font-size:0.82rem;color:var(--text-tertiary);white-space:nowrap;" class="d-none d-md-block">${s.year}</span>
          <span class="track-duration">${s.dur}</span>
        </div>
      </a>
    `).join('');
  }

  render(songs);
</script>
</body>
</html>
